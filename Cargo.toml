[package]
name = "ai-catalog-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
ai-catalog = "0.4.0"
ai-catalog-discover = "0.4.0"
ai-catalog-trust = "0.4.0"
ai-catalog-validate = "0.4.0"
axum = "0.8.9"
ipnet = "2.12.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
url = "2.5.8"
